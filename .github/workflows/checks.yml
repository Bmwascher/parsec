name: Checks

# Runs on every push and pull request: the changelog check (which runs the
# STE checker on CHANGELOG.md) and pytest by folder. Windows, because the
# tool's junction, taskkill and path rules are Windows rules.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Changelog and STE
        run: python evals/tools/check_changelog.py

      # Almost all test time is child processes (git and the fake CLI), so
      # the tests run in parallel, one worker per CPU. The order is shuffled
      # so a test that only passes after another one fails; the log's header
      # prints the seed (-q would hide it). To reproduce a failure, rerun
      # serially with that seed: -p no:xdist --randomly-seed=<n>.
      - name: Tests
        run: |
          python -m pip install --quiet pytest pytest-xdist==3.8.0 pytest-randomly==5.1.0
          python -m pytest evals/tests -n auto
