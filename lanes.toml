# Lanes the TOOL launches. Claude seats (author, implementer, reviewer-opus,
# reviewer-fable) are not here: their model and effort live in the agent files.
# `command` is a list, so a test can substitute a fake CLI. Full model ids only:
# what an alias resolves to was never measured (old item 81).

[astra]
model = "gpt-6-astra"
effort = "high"
command = ["codex"]
update = ["npm", "install", "-g", "@openai/codex@latest"]

[sol]                                   # the alternate, on Brandon's word or the config
model = "gpt-5.6-sol"
effort = "high"
command = ["codex"]
update = ["npm", "install", "-g", "@openai/codex@latest"]

[kimi]                                  # effort lives in the lane home's config (no CLI flag)
model = "kimi-code/k3"
command = ["kimi"]
home = "C:/Users/Brandon/.kimi-code-lane"
update = ["kimi", "update"]

[gemini]                                # the build lane, run by `build run`; no agent around it
model = "gemini-3.8-flash-high"
command = ["agy"]
update = ["agy", "update"]              # Brandon, 2026-09-22: agy's own "Update CLI" subcommand
